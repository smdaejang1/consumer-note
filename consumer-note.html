<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>소비자 관리 노트</title>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--border:#e2e5ec;--text:#23272f;--sub:#6b7280;
  --accent:#2f5496;--p:#2e7d32;--pb:#e8f5e9;--b:#e07b00;--bb:#fff3e0;
  --s:#1565c0;--sb:#e3f2fd;--danger:#c00000;--radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"맑은 고딕",sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px;-webkit-tap-highlight-color:transparent;}
header{position:sticky;top:0;z-index:50;background:var(--accent);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
header h1{font-size:18px;margin:0;flex:1;}
header button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;}
.con{padding:14px;}
/* 빠른등록 */
.qabox{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.qarow{display:flex;gap:8px;}
.qarow input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);font-size:15px;background:#fbfbfd;}
.qarow button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:0 18px;font-size:15px;font-weight:700;}
.qatoggle{text-align:center;font-size:12.5px;color:var(--accent);font-weight:600;margin-top:10px;padding:4px;}
.qaextra{display:none;margin-top:10px;flex-direction:column;gap:8px;}
.qaextra.open{display:flex;}
.qaextra .row2{display:flex;gap:8px;}
.qaextra input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;background:#fbfbfd;}
/* 검색/목록 */
.searchbar{margin-bottom:10px;}
.searchbar input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);font-size:14.5px;background:#fff;}
.clist{display:flex;flex-direction:column;gap:10px;}
.citem{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.cname{font-size:17px;font-weight:700;}
.cmeta{font-size:12px;color:var(--sub);}
.ctags{display:flex;gap:6px;margin-top:4px;}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.bp{background:var(--pb);color:var(--p);}
.bb2{background:var(--bb);color:var(--b);}
.bs{background:var(--sb);color:var(--s);}
.idel{width:34px;height:34px;border-radius:10px;border:1px solid #f3d3d3;background:#fff6f6;color:var(--danger);font-size:16px;font-weight:700;flex-shrink:0;}
.chevron{color:var(--sub);font-size:20px;flex-shrink:0;}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px;line-height:1.7;}
/* 기본정보 */
.basiccard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.bsection{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:12px;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld.full{grid-column:1/-1;}
.fld label{font-size:12px;color:var(--sub);font-weight:600;}
.fld input,.fld select,.fld textarea{border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:14.5px;font-family:inherit;background:#fbfbfd;width:100%;}
.fld textarea{resize:vertical;min-height:40px;}
.bsub{border-top:1px solid var(--border);padding-top:12px;margin-top:4px;}
.bsub-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;}
.info-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.info-label{font-size:12px;color:var(--sub);font-weight:700;min-width:50px;}
.info-pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;margin:2px;}
.open-btn{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--accent);background:#f0f4ff;color:var(--accent);font-size:13.5px;font-weight:700;margin-bottom:4px;}
.goal-preview-wrap{margin-bottom:6px;min-height:20px;}
.goal-month-view{margin-bottom:4px;}
.goal-month-lbl{font-size:11px;color:var(--sub);font-weight:700;}
.goal-tag{display:inline-block;background:var(--accent);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:12px;margin:2px;font-weight:600;}
/* 인라인 관계발달 */
.inline-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.inline-col-title{font-size:12px;color:var(--sub);font-weight:700;text-align:center;margin-bottom:6px;}
.inline-col-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;}
.inline-chip{padding:8px 10px;border-radius:10px;border:1px solid var(--border);font-size:13px;background:#fff;color:var(--sub);font-weight:600;text-align:center;flex:1;min-width:calc(50% - 4px);}
.inline-chip.sel{background:#e8eef8;color:var(--accent);border-color:var(--accent);font-weight:800;}
/* 인라인 3개월 목표 */
.inline-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.inline-goal-chips{display:flex;flex-direction:column;gap:5px;}
.goal-chip-btn{padding:7px 4px;border-radius:9px;border:1px solid var(--border);font-size:11.5px;background:#fff;color:var(--sub);font-weight:600;text-align:center;width:100%;}
.goal-chip-btn.sel{background:#e8eef8;color:var(--accent);border-color:var(--accent);font-weight:800;}
/* 구분 색상 — 섹션 헤더 */
.inline-col-header{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;text-align:center;margin-bottom:6px;}
.col-personal .inline-col-header{background:#dce6f7;color:#2f5496;}
.col-business .inline-col-header{background:#fde8c8;color:#e07b00;}
.col-m1 .inline-col-header{background:#dce6f7;color:#2f5496;}
.col-m2 .inline-col-header{background:#c8e6c9;color:#2e7d32;}
.col-m3 .inline-col-header{background:#fde8c8;color:#e07b00;}
/* 구분 색상 — 칩 선택 시 */
.col-personal .inline-chip.sel{background:#dce6f7;color:#2f5496;border-color:#2f5496;font-weight:800;}
.col-business .inline-chip.sel{background:#fde8c8;color:#e07b00;border-color:#e07b00;font-weight:800;}
.col-m1 .goal-chip-btn.sel{background:#dce6f7;color:#2f5496;border-color:#2f5496;font-weight:800;}
.col-m2 .goal-chip-btn.sel{background:#c8e6c9;color:#2e7d32;border-color:#2e7d32;font-weight:800;}
.col-m3 .goal-chip-btn.sel{background:#fde8c8;color:#e07b00;border-color:#e07b00;font-weight:800;}
/* 구분 색상 — 섹션 배경 (태블릿/PC만) */
@media(min-width:480px){
  .col-personal{background:#f0f4ff;border-radius:12px;padding:10px;}
  .col-business{background:#fff3e0;border-radius:12px;padding:10px;}
  .col-m1{background:#f0f4ff;border-radius:12px;padding:8px;}
  .col-m2{background:#e8f5e9;border-radius:12px;padding:8px;}
  .col-m3{background:#fff3e0;border-radius:12px;padding:8px;}
}
/* 태블릿/PC: 칩 한 줄로 */
@media(min-width:480px){
  .inline-chip{min-width:unset;flex:1;}
  .inline-col-chips{flex-wrap:nowrap;}
  .goal-chip-btn{font-size:12.5px;padding:9px 6px;}
}
/* 폰: 칩 2개씩 배치 */
@media(max-width:479px){
  .inline-chip{min-width:calc(50% - 4px);font-size:12px;padding:8px 4px;}
  .goal-chip-btn{font-size:10.5px;padding:6px 3px;}
  .inline-3col{gap:5px;}
}
.save-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;margin-top:8px;}
/* 탭 */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);border-radius:14px;padding:5px;border:1px solid var(--border);}
.tbtn{flex:1;border:none;background:transparent;padding:11px 4px;border-radius:10px;font-size:14.5px;font-weight:700;color:var(--sub);}
.tbtn.active.tp{background:var(--pb);color:var(--p);font-weight:800;}
.tbtn.active.tb{background:var(--bb);color:var(--b);}
.tbtn.active.ts{background:var(--sb);color:var(--s);}
.tpanel{display:none;border-radius:var(--radius);}
.tpanel.active{display:block;}
/* 기록 추가 버튼 */
.addbtn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;color:#fff;margin-bottom:14px;}
.addbtn.tp{background:var(--pb);color:var(--p);border:2px solid var(--p);}
.addbtn.tb{background:var(--bb);color:var(--b);border:2px solid var(--b);}
.addbtn.ts{background:var(--sb);color:var(--s);border:2px solid var(--s);}
/* 인라인 폼 */
.eform{background:var(--card);border:2px solid;border-radius:var(--radius);padding:14px;margin-bottom:14px;display:none;flex-direction:column;gap:10px;}
.eform.open{display:flex;}
.eform.tp{border-color:var(--p);background:#fafffe;}
.eform.tb{border-color:var(--b);background:#fffdf8;}
.eform.ts{border-color:var(--s);background:#f8faff;}
.eform h3{margin:0;font-size:14.5px;}
.schips{display:flex;gap:6px;flex-wrap:wrap;}
.schip{padding:8px 12px;border-radius:20px;border:1px solid var(--border);font-size:13px;background:#fff;color:var(--sub);font-weight:600;}
.schip.sel.tp{background:var(--pb);color:var(--p);border-color:var(--p);font-weight:800;}
.schip.sel.tb{background:var(--bb);color:var(--b);border-color:var(--b);font-weight:800;}
.schip.sel.ts{background:var(--sb);color:var(--s);border-color:var(--s);font-weight:800;}
.hint{font-size:12px;color:var(--accent);margin-top:6px;padding:8px 10px;background:#f0f4ff;border-radius:8px;}
.efbtns{display:flex;gap:8px;}
.efbtns button{flex:1;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:700;}
.efcancel{background:#f1f2f5;color:var(--sub);}
.efsave.tp{background:var(--pb);color:var(--p);border:2px solid var(--p);}
.efsave.tb{background:var(--bb);color:var(--b);border:2px solid var(--b);}
.efsave.ts{background:var(--sb);color:var(--s);border:2px solid var(--s);}
/* 표 */
.tblwrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
table.etbl{width:100%;border-collapse:collapse;table-layout:fixed;}
.etbl th{font-size:11.5px;font-weight:700;color:#fff;padding:9px 4px;text-align:center;}
.etbl.tp th{background:var(--pb);color:var(--p);}
.etbl.tb th{background:var(--bb);color:var(--b);}
.etbl.ts th{background:var(--sb);color:var(--s);}
.etbl td{font-size:12.5px;padding:9px 6px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.etbl td.el{text-align:left;}
.etbl tr.etr:active{background:#f5f6fa;}
.spill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700;}
.etbl.tp .spill{background:var(--pb);color:var(--p);font-weight:800;}
.etbl.tb .spill{background:var(--bb);color:var(--b);font-weight:800;}
.etbl.ts .spill{background:var(--sb);color:var(--s);font-weight:800;}
/* 펼침 */
.exprow td{cursor:default;white-space:normal;text-align:left;background:#fafbfd;padding:14px 12px;}
.expgrid{display:flex;flex-direction:column;gap:10px;}
.expfld label{display:block;font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:4px;}
.expfld textarea,.expfld input[type=date]{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;resize:vertical;min-height:36px;background:#fff;}
.expfld input[type=date]{resize:none;min-height:unset;}
.minisel{display:flex;flex-wrap:wrap;gap:4px;}
.mchip{font-size:10.5px;padding:3px 7px;border-radius:14px;border:1px solid var(--border);background:#fff;color:var(--sub);font-weight:600;}
.mchip.sel.tp{background:var(--pb);color:var(--p);border-color:var(--p);font-weight:800;}
.mchip.sel.tb{background:var(--bb);color:var(--b);border-color:var(--b);font-weight:800;}
.mchip.sel.ts{background:var(--sb);color:var(--s);border-color:var(--s);font-weight:800;}
.expbtns{display:flex;gap:8px;margin-top:4px;}
.expbtns button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;color:var(--sub);}
.expbtns .expsave.tp{background:var(--pb);color:var(--p);border:2px solid var(--p);}
.expbtns .expsave.tb{background:var(--bb);color:var(--b);border:2px solid var(--b);}
.expbtns .expsave.ts{background:var(--sb);color:var(--s);border:2px solid var(--s);}
.expbtns .expdel{color:var(--danger);border-color:#f3d3d3;}
/* 팝업 공통 */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.popup-box{background:#fff;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;}
.popup-box h3{margin:0 0 16px;font-size:17px;font-weight:700;}
.popup-row-section{margin-bottom:14px;}
/* 관계발달 가로 2열 */
.rel-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px;}
.rel-col-title{font-size:12.5px;color:var(--sub);font-weight:700;text-align:center;margin-bottom:8px;}
.rel-col-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.popup-row-label{display:block;font-size:13px;font-weight:700;color:#fff;background:var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:8px;}
.popup-row-chips{display:flex;gap:7px;flex-wrap:wrap;}
.popup-chip{padding:9px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;background:#fff;color:var(--text);font-weight:600;text-align:center;flex:1;}
.popup-chip.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
.popup-actions{display:flex;gap:10px;margin-top:16px;}
.popup-actions button{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;}
.pop-cancel{background:#f1f2f5;color:var(--sub);}
.pop-confirm{background:var(--accent);color:#fff;}
/* 하단바 */
.fbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:60;}
.fbar button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:#fafbfc;font-size:13px;font-weight:600;color:var(--text);}
#fileInput{display:none;}
.align-summary{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}
.align-summary-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px;}
.align-bar-wrap{display:flex;flex-direction:column;gap:7px;}
.align-bar-row{display:flex;align-items:center;gap:8px;}
.align-bar-label{font-size:12px;font-weight:700;color:var(--sub);min-width:60px;}
.align-bar-bg{flex:1;background:#f1f2f5;border-radius:20px;height:14px;overflow:hidden;}
.align-bar-fill{height:100%;border-radius:20px;transition:width .3s;}
.align-bar-fill.cat{background:#aab8e0;}
.align-bar-fill.smo{background:#a5d6a7;}
.align-bar-fill.stp{background:#ffcc80;}
.align-bar-count{font-size:12px;font-weight:700;min-width:24px;text-align:right;}
.align-bar-count.cat{color:#2f5496;}
.align-bar-count.smo{color:#2e7d32;}
.align-bar-count.stp{color:#e07b00;}
/* 전체 현황 박스 */
.total-summary{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.total-summary-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px;}
.total-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.total-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;}
.total-cell.cat{background:#eef2ff;}
.total-cell.smo{background:#e8f5e9;}
.total-cell.stp{background:#fff3e0;}
.total-cell .tc-num{font-size:22px;font-weight:800;}
.total-cell.cat .tc-num{color:#2f5496;}
.total-cell.smo .tc-num{color:#2e7d32;}
.total-cell.stp .tc-num{color:#e07b00;}
.total-cell .tc-lbl{font-size:11.5px;font-weight:700;color:var(--sub);}
/* 3% 얼라인 강조 섹션 */
.align-required{
  background:linear-gradient(135deg,#fff8e1,#fff3cd);
  border:2px solid #e07b00;
  border-radius:12px;
  padding:12px 14px;
  margin-top:10px;
}
.align-required-header{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.align-required-icon{font-size:20px;}
.align-required-title{
  font-size:14px;font-weight:800;color:#b35900;flex:1;
}
.align-required-badge{
  font-size:10.5px;font-weight:700;color:#fff;
  background:#e07b00;border-radius:20px;padding:3px 8px;
  white-space:nowrap;
}
.align-required-desc{
  font-size:11.5px;color:#8a4800;margin-bottom:10px;line-height:1.5;
}
.align-warning{
  font-size:11.5px;color:#c00000;font-weight:600;
  margin-top:8px;display:none;
}
.align-warning.show{display:block;}
/* 3% 체크칩 */
.align-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.align-chip{padding:7px 12px;border-radius:20px;border:1px solid var(--border);font-size:12.5px;background:#fff;color:var(--sub);font-weight:600;}
.align-chip.sel.cat{background:#eef2ff;color:#2f5496;border-color:#2f5496;font-weight:800;}
.align-chip.sel.smo{background:#e8f5e9;color:#2e7d32;border-color:#2e7d32;font-weight:800;}
.align-chip.sel.stp{background:#fff3e0;color:#e07b00;border-color:#e07b00;font-weight:800;}
.stat-view{display:none;}
.fiscal-year-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.fy-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);
  font-size:13px;font-weight:600;background:#fff;color:var(--sub);}
.fy-btn.active{background:#dce6f7;color:var(--accent);border-color:var(--accent);font-weight:800;}
.fy-btn:disabled{opacity:0.4;cursor:not-allowed;}
.stat-view.active{display:block;}
.stat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stat-header h2{margin:0;font-size:17px;font-weight:700;}
.stat-month-label{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:#f8f9fb;}
.stat-cell .sc-num{font-size:20px;font-weight:800;color:var(--accent);}
.stat-cell .sc-lbl{font-size:11px;font-weight:700;color:var(--sub);text-align:center;}
.stat-section-title{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.stat-chart-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;overflow-x:auto;}
.stat-chart-table{width:100%;border-collapse:collapse;min-width:600px;}
.stat-chart-table th{font-size:11px;color:var(--sub);font-weight:700;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);}
.stat-chart-table td{font-size:12px;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);}
.stat-chart-table tr.cur-month td{background:#f0f4ff;font-weight:700;color:var(--accent);}
.stat-bar-cell{position:relative;min-width:40px;}
.stat-bar{height:6px;border-radius:3px;background:var(--accent);display:inline-block;vertical-align:middle;min-width:2px;}
/* 전체 현황 박스 개선 */
.total-summary-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.total-row2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.total-meet-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.meet-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.meet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.meet-title{font-size:13px;font-weight:700;color:var(--text);}
.meet-count{font-size:13px;font-weight:800;color:var(--accent);}
.meet-add-btn{padding:8px 14px;border-radius:10px;border:1px dashed var(--accent);background:#f0f4ff;color:var(--accent);font-size:13px;font-weight:700;}
.meet-form{display:none;flex-direction:column;gap:8px;margin-bottom:10px;padding:10px;background:#f8f9fb;border-radius:10px;}
.meet-form.open{display:flex;}
.meet-form input,.meet-form textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;background:#fff;width:100%;}
.meet-form textarea{resize:vertical;min-height:34px;}
.meet-form-btns{display:flex;gap:8px;}
.meet-form-btns button{flex:1;padding:9px;border-radius:8px;border:none;font-size:13px;font-weight:700;}
.meet-save-btn{background:var(--accent);color:#fff;}
.meet-cancel-btn{background:#f1f2f5;color:var(--sub);}
.meet-list{display:flex;flex-direction:column;gap:6px;}
.meet-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#f8f9fb;border-radius:10px;border-left:3px solid var(--accent);}
.meet-item-date{font-size:12.5px;font-weight:700;color:var(--accent);min-width:70px;}
.meet-item-memo{font-size:12.5px;color:var(--sub);flex:1;}
.meet-item-del{font-size:12px;color:var(--danger);border:none;background:none;padding:0 4px;flex-shrink:0;}
.meet-this-month{font-size:12px;color:var(--sub);margin-top:6px;}
/* 전체 만남 현황 */
.total-meet-row{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.total-meet-cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px;border-radius:10px;background:#f0f4ff;}
.total-meet-cell .tm-num{font-size:20px;font-weight:800;color:var(--accent);}
.total-meet-cell .tm-lbl{font-size:11px;font-weight:700;color:var(--sub);}
.stage-desc-box{
  margin-top:8px;padding:9px 12px;border-radius:10px;
  background:#f0f4ff;border-left:4px solid var(--accent);
  font-size:12.5px;color:var(--accent);line-height:1.5;
  min-height:38px;display:none;
}
.stage-desc-box.show{display:block;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2a2e36;color:#fff;padding:10px 18px;border-radius:30px;font-size:13.5px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>

<script>
// ── 상수 ──────────────────────────────────────────────
const STORAGE_KEY = 'consumerNoteData_v1';
const STAGES = {
  product:  ['공유','인지','선택','구매','확인'],
  business: ['소개','이해','파트너','소비자관리'],
  system:   ['권유','동행','후속']
};
const HINTS = {
  product: {
    '공유':'이 소비자의 문제점·두려움·결핍 중 어떤 부분에 이 제품이 닿나요?',
    '인지':'소비자가 어느 정도 와닿은 것 같나요? 어떤 반응이었나요?',
    '선택':'소비자가 "써보겠다"는 의사를 보인 계기는 무엇이었나요?',
    '구매':'어떤 제품을 구매했나요? 결핍이 어떻게 채워지고 있나요?',
    '확인':'사용 후 문제점이 해소됐나요? 만족도와 재구매 의향은?'
  }
};
const CLS  = {product:'tp', business:'tb', system:'ts'};
const TH   = {
  product:  ['일정','제품군','니즈','진행','피드백'],
  business: ['일정','단계','니즈','진행','피드백'],
  system:   ['일정','시스템 종류','니즈','피드백','단계']
};
const REL_STAGES  = ['1단계(관심)','2단계(친한)','3단계(신뢰)','4단계(승승)'];
const ALIGN_ITEMS = [
  {key:'cat', label:'카탈로그', cls:'cat'},
  {key:'smo', label:'장스오',   cls:'smo'},
  {key:'stp', label:'STP',      cls:'stp'}
];
const STAGE_DESC = {
  product: {
    '공유': '제품 정보를 소비자에게 처음 전달한 단계',
    '인지': '소비자가 이게 나한테 맞겠다고 느끼기 시작한 단계',
    '선택': '소비자가 써보겠다는 의사를 밝힌 단계',
    '구매': '실제 구매가 완료된 단계',
    '확인': '사용 후 효과·만족도를 확인하는 단계'
  },
  business: {
    '소개': '사업 정보를 처음 전달한 단계',
    '이해': '소비자가 사업 개념을 이해하기 시작한 단계',
    '파트너': '회원 등록으로 파트너가 된 단계',
    '소비자관리': '파트너로서 소비자 관리 활동을 시작한 단계'
  },
  system: {
    '권유': '시스템 참여를 처음 제안한 단계',
    '동행': '실제로 함께 참여한 단계',
    '후속': '참여 후 소감을 나누고 다음을 계획하는 단계'
  }
};
const GOAL_ITEMS  = ['1개 제품','5개 제품','도움받는 3%','스스로 3%','복제하는 3%'];

// ── 상태 ──────────────────────────────────────────────
let data       = {consumers:[]};
let currentId  = null;
let expanded   = {product:null, business:null, system:null};
let editingId  = {product:null, business:null, system:null};
let _rel       = {personal:'', business:''};
let _goals     = {m1:[], m2:[], m3:[]};

// ── 유틸 ──────────────────────────────────────────────
function load(){
  try{const r=localStorage.getItem(STORAGE_KEY);if(r){data=JSON.parse(r);}if(!data.consumers)data.consumers=[];}
  catch(e){data={consumers:[]};}
  // 기존 데이터 마이그레이션: meets 필드 없으면 추가
  data.consumers.forEach(c=>{
    if(!c.meets) c.meets=[];
    ['product','business','system'].forEach(t=>{
      (c[t]||[]).forEach(e=>{ if(!e.aligns) e.aligns=[]; });
    });
  });
}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
  catch(e){toast('저장 실패:'+e.message);}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':(s||'-');}
function curC(){return data.consumers.find(c=>c.id===currentId);}
let _tt=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),1800);}

// ── 목록 ──────────────────────────────────────────────
function renderList(){
  const q=document.getElementById('searchInput').value.trim();
  const listEl=document.getElementById('cList');
  const emptyEl=document.getElementById('emptyMsg');
  let arr=data.consumers.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(q)arr=arr.filter(c=>c.name.includes(q));
  listEl.innerHTML='';
  if(!arr.length){emptyEl.style.display='block';listEl.style.display='none';renderTotalSummary();return;}
  emptyEl.style.display='none';listEl.style.display='flex';
  renderTotalSummary();
  arr.forEach(c=>{
    const thisMonth=today().slice(0,7);
    const mc=(c.meets||[]).filter(m=>(m.date||'').startsWith(thisMonth)).length;
    const aligns=calcAligns(c);
    const rel=c.relBasic||{};
    const relTxt=(rel.personal?'개인 '+rel.personal:'')+(rel.business?' / 사업 '+rel.business:'');
    const div=document.createElement('div');
    div.className='citem';
    div.innerHTML=
      '<div class="cinfo">'+
        '<div class="cname">'+esc(c.name)+'</div>'+
        '<div class="cmeta">'+(relTxt||'관계발달 미설정')+'</div>'+
        '<div class="ctags">'+
          '<span class="badge" style="background:#fff0f5;color:#c00060">🤝 '+mc+'회</span>'+
          '<span class="badge" style="background:#eef2ff;color:#2f5496">카탈 '+aligns.cat+'</span>'+
          '<span class="badge" style="background:#e8f5e9;color:#2e7d32">장스오 '+aligns.smo+'</span>'+
          '<span class="badge" style="background:#fff3e0;color:#e07b00">STP '+aligns.stp+'</span>'+
          '<span class="badge bp">📦 '+(c.product||[]).length+'</span>'+
          '<span class="badge bb2">💼 '+(c.business||[]).length+'</span>'+
          '<span class="badge bs">🎓 '+(c.system||[]).length+'</span>'+
        '</div>'+
      '</div>'+
      '<button class="idel">✕</button>'+
      '<span class="chevron">›</span>';
    div.querySelector('.cinfo').addEventListener('click',()=>openDetail(c.id));
    div.querySelector('.chevron').addEventListener('click',()=>openDetail(c.id));
    div.querySelector('.idel').addEventListener('click',ev=>{
      ev.stopPropagation();
      const total=pc+bc+sc;
      const msg=total>0?c.name+' 님을 삭제할까요?\n(기록 '+total+'건도 함께 삭제됩니다)':c.name+' 님을 삭제할까요?';
      if(confirm(msg)){data.consumers=data.consumers.filter(x=>x.id!==c.id);save();renderList();toast(c.name+' 님 삭제됨');}
    });
    listEl.appendChild(div);
  });
}

// 빠른 등록
function quickAdd(){
  const nameEl=document.getElementById('qaName');
  const name=nameEl.value.trim();
  if(!name){toast('이름을 입력해 주세요');nameEl.focus();return;}
  data.consumers.push({
    id:uid(),name,
    intro:document.getElementById('qaIntro').value.trim(),
    firstDate:document.getElementById('qaDate').value||today(),
    product:[],business:[],system:[],meets:[],
    updatedAt:Date.now()
  });
  save();
  nameEl.value='';
  document.getElementById('qaIntro').value='';
  document.getElementById('qaDate').value='';
  document.getElementById('qaExtra').classList.remove('open');
  renderList();
  toast(name+' 님이 추가되었습니다');
}
document.getElementById('qaAdd').addEventListener('click', quickAdd);
document.getElementById('qaName').addEventListener('keydown', e=>{if(e.key==='Enter')quickAdd();});
document.getElementById('qaToggle').addEventListener('click', ()=>document.getElementById('qaExtra').classList.toggle('open'));
document.getElementById('searchInput').addEventListener('input', renderList);

// ── 상세 ──────────────────────────────────────────────
function openDetail(id){
  currentId=id;
  expanded={product:null,business:null,system:null};
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').style.display='block';
  document.getElementById('backBtn').style.display='inline-block';
  closeAllForms();
  setActiveTab('product');
  fillBasicForm();
  renderAlignSummary(curC());
  renderMeets();
  renderAllEntries();
}
document.getElementById('backBtn').addEventListener('click',()=>{
  currentId=null;
  document.getElementById('detailView').style.display='none';
  document.getElementById('listView').style.display='block';

function calcAligns(consumer){
  const counts={cat:0,smo:0,stp:0};
  ['product','business','system'].forEach(type=>{
    (consumer[type]||[]).forEach(e=>{
      (e.aligns||[]).forEach(a=>{ if(counts[a]!==undefined) counts[a]++; });
    });
  });
  return counts;
}

function renderAlignSummary(consumer){
  const counts=calcAligns(consumer);
  const max=Math.max(...Object.values(counts),1);
  ['cat','smo','stp'].forEach(key=>{
    const bar=document.getElementById('bar-'+key);
    const cnt=document.getElementById('cnt-'+key);
    if(bar) bar.style.width=(counts[key]/max*100)+'%';
    if(cnt) cnt.textContent=counts[key];
  });
}

function renderTotalSummary(){
  const thisMonth=today().slice(0,7);
  const totals={cat:0,smo:0,stp:0};
  data.consumers.forEach(c=>{
    ['product','business','system'].forEach(type=>{
      (c[type]||[]).forEach(e=>{
        if((e.date||'').startsWith(thisMonth)){
          (e.aligns||[]).forEach(a=>{ if(totals[a]!==undefined) totals[a]++; });
        }
      });
    });
  });
  ['cat','smo','stp'].forEach(key=>{
    const el=document.getElementById('tot-'+key);
    if(el) el.textContent=totals[key];
  });
  // 만남 인원/횟수
  let meetPeople=0, meetTotal=0;
  let totProd=0, totBiz=0, totSys=0;
  data.consumers.forEach(cc=>{
    const cnt=(cc.meets||[]).filter(m=>(m.date||'').startsWith(thisMonth)).length;
    if(cnt>0){ meetPeople++; meetTotal+=cnt; }
    (cc.product||[]).forEach(e=>{ if((e.date||'').startsWith(thisMonth)) totProd++; });
    (cc.business||[]).forEach(e=>{ if((e.date||'').startsWith(thisMonth)) totBiz++; });
    (cc.system||[]).forEach(e=>{ if((e.date||'').startsWith(thisMonth)) totSys++; });
  });
  const mpEl=document.getElementById('tot-meet-people');
  const mcEl=document.getElementById('tot-meet-count');
  if(mpEl) mpEl.textContent=meetPeople;
  if(mcEl) mcEl.textContent=meetTotal;
  const tpEl=document.getElementById('tot-prod');
  const tbEl=document.getElementById('tot-biz');
  const tsEl=document.getElementById('tot-sys');
  if(tpEl) tpEl.textContent=totProd;
  if(tbEl) tbEl.textContent=totBiz;
  if(tsEl) tsEl.textContent=totSys;
}

function renderRelInline(){
  [{id:'relChipsP',key:'personal'},{id:'relChipsB',key:'business'}].forEach(({id,key})=>{
    const wrap=document.getElementById(id);if(!wrap)return;
    wrap.innerHTML='';
    REL_STAGES.forEach(s=>{
      const btn=document.createElement('button');
      btn.className='inline-chip'+(s===_rel[key]?' sel':'');
      btn.textContent=s;btn.type='button';

      wrap.appendChild(btn);

// ── 3개월 목표 인라인 ──────────────────────────────────
function renderGoalInline(){
  [1,2,3].forEach(m=>{
    const wrap=document.getElementById('goalChipsM'+m);if(!wrap)return;
    wrap.innerHTML='';
    GOAL_ITEMS.forEach(item=>{
      const btn=document.createElement('button');
      btn.className='goal-chip-btn'+(_goals['m'+m].includes(item)?' sel':'');
      btn.textContent=item;btn.type='button';
      btn.addEventListener('click',()=>{
        btn.classList.toggle('sel');
        if(btn.classList.contains('sel')){
          if(!_goals['m'+m].includes(item))_goals['m'+m].push(item);
        }else{
          _goals['m'+m]=_goals['m'+m].filter(x=>x!==item);
        }
      });
      wrap.appendChild(btn);
    });
  });
}

    html+='<div class="fld"><label>진행 (대안 제시 · 반응)</label><textarea id="ef_proposal" placeholder="어떤 방식으로 제안했고, 상대의 반응은 어땠나요?">'+esc(existing?existing.proposal:'')+'</textarea></div>';
  }else{
    html+='<div class="fld"><label>니즈 (문제점·두려움·결핍)</label><textarea id="ef_needs" placeholder="어떤 관심이나 필요로 시스템에 참여했나요?">'+esc(existing?existing.needs:'')+'</textarea></div>';

function openForm(type,entryId){
  const c=curC();
  const existing=entryId?(c[type]||[]).find(x=>x.id===entryId):null;
  editingId[type]=entryId;
  const formEl=document.getElementById('form-'+type);
  formEl.innerHTML=buildForm(type,existing);
  formEl.classList.add('open');
  let selStage=existing?existing.stage:STAGES[type][0];
  formEl.querySelectorAll('.schip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      formEl.querySelectorAll('.schip').forEach(x=>x.classList.remove('sel'));
      chip.classList.add('sel');selStage=chip.dataset.stage;
      const hint=document.getElementById('ef_hint');
      if(hint&&HINTS[type])hint.textContent=HINTS[type][selStage]||'';
      const desc=document.getElementById('ef_desc');
      if(desc){
        const txt=(STAGE_DESC[type]&&STAGE_DESC[type][selStage])||'';
        desc.textContent=txt;
        desc.classList.toggle('show',!!txt);
      }
    });
  });
  formEl.querySelectorAll('.align-chip').forEach(chip=>{
    chip.addEventListener('click',()=>chip.classList.toggle('sel'));
  });
  document.getElementById('ef_cancel').addEventListener('click',()=>{formEl.classList.remove('open');formEl.innerHTML='';editingId[type]=null;});
  document.getElementById('ef_save').addEventListener('click',()=>{
    const selAligns=[...formEl.querySelectorAll('.align-chip.sel')].map(ch=>ch.dataset.align);
    const warnEl=document.getElementById('ef_alignWarn');
    if(selAligns.length===0){
      if(warnEl) warnEl.classList.add('show');
      if(!confirm('3% 필수 액션을 선택하지 않았습니다.\n선택 없이 저장할까요?')){return;}
    } else {
      if(warnEl) warnEl.classList.remove('show');
    }
    const targetEl=document.getElementById('ef_target');
    const needsEl=document.getElementById('ef_needs');
    const proposalEl=document.getElementById('ef_proposal');
    const payload={
      date:document.getElementById('ef_date').value||today(),
      target:targetEl?targetEl.value.trim():'',
      needs:needsEl?needsEl.value.trim():'',
      proposal:proposalEl?proposalEl.value.trim():'',
      note:document.getElementById('ef_note').value.trim(),
      stage:selStage,
      aligns:selAligns
    };
    const cc=curC();
    if(existing)Object.assign(existing,payload);
    else cc[type].push({id:uid(),...payload});
    cc.updatedAt=Date.now();save();
    formEl.classList.remove('open');formEl.innerHTML='';editingId[type]=null;
    renderEntries(type);
    if(curC()) renderAlignSummary(curC());
    renderTotalSummary();
    toast('기록이 저장되었습니다');
  });
}

    if(desc){
      const txt=(STAGE_DESC[type]&&STAGE_DESC[type][selStage])||'';
      desc.textContent=txt;
      desc.classList.toggle('show',!!txt);
    }
  }));
  row.querySelector('.expsave').addEventListener('click',ev=>{
    ev.stopPropagation();
    const targetEl=document.getElementById('ex_target');
    const needsEl=document.getElementById('ex_needs');
    const proposalEl=document.getElementById('ex_proposal');
    e.date=document.getElementById('ex_date').value||e.date;
    if(targetEl)e.target=targetEl.value.trim();
    if(needsEl)e.needs=needsEl.value.trim();
    if(proposalEl)e.proposal=proposalEl.value.trim();
    e.note=document.getElementById('ex_note').value.trim();
    e.stage=selStage;
    c.updatedAt=Date.now();save();
    toast('저장되었습니다');renderEntries(type);
  });
  row.querySelector('.expdel').addEventListener('click',ev=>{
    ev.stopPropagation();
    if(confirm('이 기록을 삭제할까요?')){
      c[type]=c[type].filter(x=>x.id!==entryId);
      c.updatedAt=Date.now();save();
      expanded[type]=null;renderEntries(type);
    if(curC()) renderAlignSummary(curC());
    renderTotalSummary();
    toast('삭제되었습니다');
    }
  });
}

document.getElementById('backupBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});

document.getElementById('restoreBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',ev=>{
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed.consumers)throw new Error('형식 오류');
      if(confirm('현재 데이터를 덮어씁니다. 계속할까요?')){data=parsed;save();renderList();toast('복원 완료');}
    }catch(e){toast('파일을 읽을 수 없습니다');}
    ev.target.value='';
  };
  reader.readAsText(file);
});

// ── 통계 화면 ─────────────────────────────────────────
function getFiscalStartYear(){
  // 현재 날짜 기준 회계연도 시작 연도
  const now=new Date();
  const mo=now.getMonth()+1;
  return mo>=9 ? now.getFullYear() : now.getFullYear()-1;
}

function getFiscalMonths(startYear){
  // startYear: 회계연도 시작 연도 (9월 기준)
  if(!startYear) startYear=getFiscalStartYear();
  const months=[];
  for(let i=0;i<12;i++){
    const m=((9+i-1)%12)+1;
    const y=startYear+(Math.floor((9+i-1)/12));
    months.push(y+'-'+String(m).padStart(2,'0'));
  }
  return months;
}

function getAvailableFiscalYears(){
  // 데이터가 있는 회계연도 목록 반환
  const allDates=[];
  data.consumers.forEach(cc=>{
    ['product','business','system'].forEach(t=>{
      (cc[t]||[]).forEach(e=>{ if(e.date) allDates.push(e.date); });
    });
    (cc.meets||[]).forEach(m=>{ if(m.date) allDates.push(m.date); });
  });
  const fiscalYears=new Set();
  // 현재 회계연도는 항상 포함
  fiscalYears.add(getFiscalStartYear());
  allDates.forEach(d=>{
    const yr=parseInt(d.slice(0,4));
    const mo=parseInt(d.slice(5,7));
    // 이 날짜가 속한 회계연도 시작연도 계산
    fiscalYears.add(mo>=9 ? yr : yr-1);
  });
  return [...fiscalYears].sort((a,b)=>a-b);
}

function calcMonthStats(ym){
  let meet=0,meetP=0,cat=0,smo=0,stp=0,prod=0,biz=0,sys=0;
  const people=new Set();
  data.consumers.forEach(cc=>{
    const mc=(cc.meets||[]).filter(m=>(m.date||'').startsWith(ym)).length;
    if(mc>0){people.add(cc.id); meet+=mc;}
    const calcA=(arr)=>arr.filter(e=>(e.date||'').startsWith(ym)).reduce((acc,e)=>{
      (e.aligns||[]).forEach(a=>{if(a==='cat')acc.cat++;if(a==='smo')acc.smo++;if(a==='stp')acc.stp++;});
      return acc;
    },{cat:0,smo:0,stp:0});
    ['product','business','system'].forEach(t=>{
      (cc[t]||[]).forEach(e=>{
        if((e.date||'').startsWith(ym)){
          if(t==='product')prod++;
          if(t==='business')biz++;
          if(t==='system')sys++;
          (e.aligns||[]).forEach(a=>{if(a==='cat')cat++;if(a==='smo')smo++;if(a==='stp')stp++;});
        }
      });
    });
  });
  return {ym,meetP:people.size,meet,cat,smo,stp,prod,biz,sys};
}

let _selectedFY=null; // 선택된 회계연도 시작연도

function renderFYTabs(){
  const tabs=document.getElementById('fyTabs');
  if(!tabs)return;
  const years=getAvailableFiscalYears();
  const curFY=getFiscalStartYear();
  if(!_selectedFY) _selectedFY=curFY;
  tabs.innerHTML='';
  years.forEach(yr=>{
    const btn=document.createElement('button');
    btn.className='fy-btn'+(yr===_selectedFY?' active':'');
    btn.textContent=yr+'.'+'09 ~ '+(yr+1)+'.'+'08';
    if(yr===curFY) btn.textContent+=' (현재)';
    btn.addEventListener('click',()=>{
      _selectedFY=yr;
      renderStatView();
    });
    tabs.appendChild(btn);
  });
}

function renderStatView(){
  const thisMonth=today().slice(0,7);
  const now=new Date();
  if(!_selectedFY) _selectedFY=getFiscalStartYear();
  renderFYTabs();
  document.getElementById('statMonthLabel').textContent=
    _selectedFY+'년 9월 ~ '+(_selectedFY+1)+'년 8월 회계연도';

  // 이번 달 현황 (실제 이번 달 기준, 선택 연도 무관)
  const tm=calcMonthStats(thisMonth);
  const cols=[
    {lbl:'만남 인원',val:tm.meetP,bg:'#fff0f5',col:'#c00060'},
    {lbl:'만남 횟수',val:tm.meet,bg:'#fff0f5',col:'#c00060'},
    {lbl:'카탈로그',val:tm.cat,bg:'#eef2ff',col:'#2f5496'},
    {lbl:'장스오',val:tm.smo,bg:'#e8f5e9',col:'#2e7d32'},
    {lbl:'STP',val:tm.stp,bg:'#fff3e0',col:'#e07b00'},
    {lbl:'📦 제품',val:tm.prod,bg:'#fdf3ff',col:'#6a0dad'},
    {lbl:'💼 사업',val:tm.biz,bg:'#f0fff4',col:'#276749'},
    {lbl:'🎓 시스템',val:tm.sys,bg:'#ebf8ff',col:'#2a4a7f'},
  ];
  const tmEl=document.getElementById('statThisMonth');
  tmEl.innerHTML='';
  cols.forEach(col=>{
    const div=document.createElement('div');
    div.className='stat-cell';
    div.style.background=col.bg;
    div.innerHTML='<span class="sc-num" style="color:'+col.col+'">'+col.val+'</span><span class="sc-lbl">'+col.lbl+'</span>';
    tmEl.appendChild(div);
  });

  // 회계연도 월간 추이 테이블
  const months=getFiscalMonths(_selectedFY);
  const keys=['만남인원','만남횟수','카탈','장스오','STP','제품','사업','시스템'];
  const head=document.getElementById('statYearHead');
  head.innerHTML='<th>월</th>'+keys.map(k=>'<th>'+k+'</th>').join('');
  const body=document.getElementById('statYearBody');
  body.innerHTML='';
  const allStats=months.map(ym=>calcMonthStats(ym));
  const maxVals={};
  keys.forEach((k,i)=>{
    const vals=allStats.map(s=>[s.meetP,s.meet,s.cat,s.smo,s.stp,s.prod,s.biz,s.sys][i]);
    maxVals[i]=Math.max(...vals,1);
  });
  allStats.forEach(s=>{
    const tr=document.createElement('tr');
    if(s.ym===thisMonth) tr.className='cur-month';
    const vals=[s.meetP,s.meet,s.cat,s.smo,s.stp,s.prod,s.biz,s.sys];
    tr.innerHTML='<td>'+s.ym.slice(0,7)+'</td>'+
      vals.map((v,i)=>'<td>'+v+'<br><span class="stat-bar" style="width:'+Math.round(v/maxVals[i]*40)+'px"></span></td>').join('');
    body.appendChild(tr);
  });
}
